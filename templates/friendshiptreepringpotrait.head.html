<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendship Tree</title>
    <script src="assets/js/jquery-2.1.1.min.js"></script>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Krona+One&display=swap');
        .title {
            font-family: "Kaushan Script", cursive;
            font-size: 32px;
            font-weight: 600;
            color: #33691e;
            /* text-shadow: 5px 5px black; */
        }
        html{
            height: 100%;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            /*height: 100%;*/
            margin: 0;
           /* overflow: hidden;*/
            color: #ffffff;
            background: #f5f5f5;
           /* background-image: url('/friendship-tree/assets/friendship_tree_bgimage.png');*/
            background: -webkit-linear-gradient(to left, #ffc6d9, #FCE4EC, #B39DDB);
            background: linear-gradient(to left, #ffc6d9, #FCE4EC, #B39DDB);
            
        }
        .container{
            display:flex;
            justify-content: center;
            align-items: center;
           /* width: 100vw;
            height: 100vh;*/
        }
        .top-center {
            position: fixed;
            display: flex;
            width: 300px;
            height: 200px;
            border-radius: 50%;
            top: 580px;
            left: -5px;
            padding: 20px;
            text-align: center;
            transform: rotate(-10deg);
            /* background: url(/friendship-tree/assets/leaf-pattern.jpg); */
            /* background-position: center; */
            /* background-size: cover; */
            /* background-color: white; */
            /* background-blend-mode: overlay; */
            justify-content: center;
            align-items: center;
            flex-direction: column;
            /* border: 1px solid #0f3027; */
            /* box-shadow: rgba(50, 50, 93, 0.25) 0px 50px 100px -20px, rgba(0, 0, 0, 0.3) 0px 30px 60px -30px; */
            /* animation: leafAni 3s infinite; */
            margin: 5px;
        }
        @keyframes leafAni{
            0%{
                transform: translateY(0px) rotate(-10deg);
            }
            50%{
                transform: translateY(-10px) rotate(-10deg);
            }
            100%{
                transform: translateY(0px) rotate(-10deg);
            }
        }
        #friends_list{
            /*width:55%;*/
        }
        .bday {

            border: 3px solid #fff;
        }
        .user-titel{
            /*position: relative;*/
        }
        .user-titel h4 {
            /*position: absolute;*/
            text-align: center;
            background: #dd1052;
            padding: 0.5em;
            border-radius: 1em;
            box-shadow: rgba(0, 0, 0, 0.25) 0px 14px 28px, rgba(0, 0, 0, 0.22) 0px 10px 10px;
            color: #fff;
            margin: 0;
            width: 100%;
            bottom: 0.5em;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 18px;
            font-weight: 900;
        }
      /* CSS styles for the friendship tree */
        .tree {
            position: relative;
            width: 800px;
            height: 720px; /* Adjust height as needed */
            background-image: url('/app_playtown/friendship_tree/assets/img/tree-bg.png'); /* Replace 'tree_background.jpg' with your image path */
            background-size: contain;
           /*overflow: hidden;*/
            margin: 50px auto;
            background-repeat: no-repeat;
        }

       .photo-frame, .photo-frame-big{
            position: absolute;
            width: 100px;
            height: 100px;
            left: 50%;
            top: 50%;
            transform: translateX(-50%) translateY(-50%);
            border-radius: 50em;
            z-index: 9;
        }

        .photo-frame h4{
            width: 100%;
            background-color: #fff;
            text-align: center;
            margin: 0;
            padding: 3px;
        }
        .photo-frame-big h4{
            width: 100%;
            background-color: #fff;
            text-align: center;
            margin: 0;
            padding: 5px;
        }
        .top-left-logo {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 99;
        }
        .bottom-left-logo {
            position: fixed;
            bottom: 0;
            left: 0;
        }
        .top-right-logo {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 99;
        }
        .bottom-right-logo {
            position: fixed;
            bottom: 0;
            right: 10px;
        }

        .top-center h4 {
            margin: 10px 0 5px;
            font-size: 16px;
            font-family: "Krona One", sans-serif;
            color: #333;
        }
        .bottom-center {
            position: fixed;
            left: 50%;
            top: 80%;
            transform: translateX(-50%) translateY(-50%);
            /*width: 100px;*/
            text-align: center;
            color: black;
            /*background: white;*/
            z-index: 999999;
        }
        
        .intro-ani{
            animation-name: introAni;
            animation-duration: 6s;
            z-index: 99 !important;
        }

        @keyframes introAni{
            0%{
                top: 50%;
                left: 50%;
                transform: translateX(-50%) translateY(-50%) scale(3);
                
            }
            90%{
                top: 50%;
                left: 50%;
                transform: translateX(-50%) translateY(-50%) scale(3);
            }
            100%{
                transform: scale(1) translateX() translateY() scale(1);
            }
        }
        .bgVideo {
            position: fixed;
            left: 0;
            top: 0;
            min-width: 100%; 
            min-height: 100%;
            /*background-image: url('/friendship-tree/assets/friendship_tree_bgimage.png');*/
            /*background-repeat: no-repeat;*/
        }
        .qr-code{
            display: flex;
            flex-direction: column;
            align-items: center;
            position: fixed;
            top: 0;
            right: 0;
          /*  background-color: #00000070;*/
            border-radius: 5px;
            /*padding: 5px;*/
        }
        .circle-frame {
            position: relative;
            width: 100px; /* Adjust the size of the circle-frame */
            height: 100px; /* Adjust the size of the circle-frame */
            overflow: hidden;
        }
        
        .frame-image {
            width: 100%; /* Make the frame image fill the circle-frame */
            height: auto;
            display: block;
        }
        
        .inner-image {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 100%; /* Make the inner image fill the circle-frame */
            height: auto;
            display: block;
            height: 80px;
            width: 80px;
            border-radius: 50em;
            object-fit: cover;
        }
        @media print {
            /* Insert page break after each element with class "page-break" */
            table{
                width: -webkit-fill-available;
            }
            /* Insert page break after each element with class "page-break" */
            /*.no-page-break {
                page-break-inside: avoid;
            }*/
            thead
            {
                display: table-header-group;
            }
            tfoot
            {
                display: table-footer-group;
            }
            .no-page-break { page-break-inside:avoid; page-break-after:auto }
        }
    </style>
</head>
<body id="body_content">
