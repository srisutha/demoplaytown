    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">

</head>
<body class="flex flex-col min-h-screen bg-gray-100">
 <header class="bg-blue-600 text-white py-4 px-6 flex justify-between items-center">
        <img src="https://demo.playtown.co.in/app_playtown/assets/img/Indian-Bank-logo.jpg" alt="LogoDesign" class="bg-white h-[45px] col-span-1 p-1 ml-2" />
        <!--<nav>
            <ul class="flex space-x-6">
                <li><a href="https://guest-journo.playtown.co.in/admin" class="hover:underline">Guest Journo</a></li>
                <li><a href="https://swagatham.playtown.co.in/admin" class="hover:underline">Swagatham</a></li>

    </header>
 <main class="container mx-auto p-6 flex-grow bg-white">
    <table id="userTable" class="display">
    <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Wishes</th>
            <th>Organization</th>
            <th>Designation</th>
            <th>Photo</th>
            <th>Status</th>
            <th>Created On</th>
            <th>Action</th>
        </tr>
    </thead>
</table>
</main>
  <footer class="bg-gray-800 text-white text-center py-4 mt-6">
        <p>&copy; 2025 Mediapoint All Rights Reserved.</p>
    </footer>
<script>
    $(document).ready(function() {
    var table = $('#userTable').DataTable({
        "ajax": "common-ajax.php?action=list_wall_of_wishes_json",
        "columns": [
            { "data": "user_info", "title": "Name" },
            { "data": "user_email", "title": "Email"},
            { "data": "user_description", "title": "Wishes" },
            { "data": "user_organization", "title": "Organization", "visible": false },
            { "data": "user_designation", "title": "Designation", "visible": false },
            { "data": "user_image", "title": "Photo" },
            { "data": "status", "title": "Status" },
            { "data": "created_at", "title": "Created On" },
            { "data": "buttons", "title": "Action", "orderable": false }
        ],
        dom: 'Bfrtip',
        buttons: [
            {
                extend: 'excelHtml5',
                text: 'Export to Excel',
                exportOptions: {
                    columns: [0, 2, 6, 7] // Exclude Photo (index 5) and Action (index 8)
                }
            },
            {
                text: 'Export to PDF',
                action: function (e, dt, node, config) {
                    // Manually call the default pdfHtml5 button's action
                    /*$.fn.dataTable.ext.buttons.pdfHtml5.action.call(this, e, dt, node, {
                        extend: 'pdfHtml5',
                        exportOptions: {
                            columns: [0, 2, 6, 7]
                        }
                    });*/
        
                    // Optional redirect after 2 seconds
                    
                        window.location.href = 'wall_of_wishes_print.php';
                }
            }
        ]

    });
    $(document).on("click", ".approve, .reject", function() {
        var id = $(this).data("id");
        var status = $(this).hasClass("approve") ? 1 : 2;

        $.post("common-ajax.php?action=update_wall_of_wishes_json", { id: id, status: status }, function(response) {
            var res = JSON.parse(response);
            if (res.success) {
                table.ajax.reload();
            } else {
                alert("Error: " + res.message);
            }
        });
    });
});

</script>
</body>
</html>
