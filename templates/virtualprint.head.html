    <style>
        /*body {*/

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: #333;
            background: url(/app_playtown/virtual_wish_pod/assets/wall.jpeg);
        }
        .testimonial-container {
           /* padding: 70px 20px;*/
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        
        .grid-container {
            position:relative;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1200px;
           /* margin: 0 auto;*/
        }
        
        .card {
            position: relative;
            background: #ffffff;
            border-radius: 15px;
            /*padding: 20px;*/
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        
        .card-header {
            width: 100px;
            height: 100px;
            overflow: hidden;
            border-radius: 50%;
            margin-bottom: 10px;
            margin-top: 10px;
            border: 5px solid #3b5998;
        }
        
        .profile-pic {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .card-content {
            padding: 10px;
            font-size: 14px;
        }
        
        .user-name {
            font-size: 18px;
            font-weight: bold;
            margin: 5px 0;
            color: #3b5998;
        }
        
        .user-role {
            font-size: 14px;
            color: #666666;
            margin-bottom: 10px;
        }
        
        .user-message {
            font-size: 12px;
            font-style: italic;
            color: #333;
        }
        
        
        @media print {
            body {
                margin: 30px 0; /* Top and bottom margins to accommodate fixed header/footer */
            }
            .header, .footer {
                position: fixed;
            }

            .header {
                top: 0;
            }
            .footer {
                bottom: 0;
            }

            
            .grid-container {
                top:70px;
                padding: 70px 20px;
                margin-bottom: 20px; /* Add space between sections */
            }
        
            .card {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            /*@page {*/
               
                /*margin: 100mm; */
                /* Define page margins */
            /*}*/
        }
    .header, .footer {
        position: fixed;
        left: 0;
        right: 0;
        height: 50px;
        /*background-color: #f0f0f0;*/
        text-align: center;
        line-height: 50px;
        font-size: 18px;
        font-weight: bold;
    }
